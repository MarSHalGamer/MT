<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MT | حياة واقعية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e12;--cd:#1a1a21;--bd:#2c2c37;--tx:#f3f3f6;--mt:#9a9aa8;--o1:#ff9a1f;--o2:#ff4d00;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',system-ui,sans-serif;line-height:1.6}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#0e0e12ee;border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header img{height:34px;background:#fff;border-radius:8px;padding:3px}
header[hidden]{display:none}nav{display:flex;gap:6px;flex:0 0 100%;order:3;overflow-x:auto}
nav button,.tab{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:6px 14px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on,.tab.on{background:linear-gradient(135deg,var(--o1),var(--o2));border-color:transparent;font-weight:700}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.hero{text-align:center;padding:22px 10px;border-radius:16px;background:radial-gradient(circle at 50% 0,#ff6a0030,transparent 70%)}
.hero img,.lg{height:70px;background:#fff;border-radius:14px;padding:6px}
input,select,textarea{width:100%;background:#101016;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;margin:5px 0}
textarea{min-height:80px}
.btn{width:100%;background:linear-gradient(135deg,var(--o1),var(--o2));color:#fff;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:800;cursor:pointer;margin-top:6px}
.btn.g{background:var(--cd);border:1px solid var(--bd);font-weight:400}
.lnk{background:none;border:0;color:var(--o1);cursor:pointer;font:inherit}
.mut,small{color:var(--mt)}.err{color:#ff6b6b;min-height:22px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
#msgs{height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px}
.m{background:var(--cd);border-radius:12px;padding:8px 12px;max-width:85%;align-self:flex-start}
.m.me{align-self:flex-end;background:#ff6a0030}.m b{color:var(--o1);font-size:.85em}
.row{display:flex;gap:8px}.row>*{flex:1}.st{font-size:.8em;padding:2px 10px;border-radius:10px;background:var(--bd)}
.st.ok{background:#1f7a3f}.pf{position:relative}.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--cd);font-size:18px;cursor:pointer}.pm{position:absolute;top:115%;right:0;min-width:250px;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;z-index:9}.pm[hidden]{display:none}.pm button{background:#101016;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit;cursor:pointer}.st.no{background:#8a2b2b}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){color-scheme:dark}}
</style></head><body>
<header id="hd" hidden><div class="pf"><button class="ic" id="pb" aria-label="الحساب">👤</button><div class="pm" id="pm" hidden><button id="pd">التفاصيل</button><div id="pi" hidden></div><button id="pu" hidden>👥 رؤية جميع الحسابات</button><button id="pa" hidden>➕ إضافة قطاع</button><div id="ps" hidden><input id="psn" placeholder="اسم القطاع"><input id="psi" placeholder="إيموجي"><button id="psb">إضافة</button><div id="psm" class="mut"></div></div><button id="out">تسجيل خروج</button></div></div><span style="flex:1"></span><img id="hl" alt="MT"><nav id="nav"></nav></header>

let SECT=[],seeding=0,PERMS=[],RANK='',RSEC=[];const DEF=[['police','الشرطة','🚓'],['cia','CIA','🕶️'],['sheriff','الشيرف','⭐'],['ems','الإسعاف','🚑'],['traffic','المرور','🚦']];const ADMINS=['error404','a5','s1'];
const join=(a,b)=>()=>{a&&a();b&&b()};
async function calcAdmin(){admin=false;PERMS=[];RANK='';RSEC=[];if(!me||me.guest)return;try{if(!await sGet('users',me.key)){me=null;try{localStorage.removeItem('mt_s')}catch(e){}return}const n=me.name.toLowerCase();if(ADMINS.includes(n)){const c=await sGet('names',await sha(n));admin=!!c&&c.uid==me.key}let p=await sGet('profiles',me.id);if(!p){p={name:me.name,id:me.id,rk:'',t:Date.now()};await sSet('profiles',me.id,p)}
for(const id of (p.rks||(p.rk?[p.rk]:[]))){const r=await sGet('ranks',id);if(r){PERMS=PERMS.concat(r.perms||[]);RANK+=(RANK?'، ':'')+(r.name||'');if(r.sec)RSEC.push(r.sec)}}}catch(e){}}
const can=p=>admin||PERMS.includes('full')||PERMS.includes(p);
function sectors(cb){return sListen('sectors',async a=>{if(!a.length&&me&&!me.guest&&!seeding){seeding=1;try{if(!await sGet('meta','sect')){await sSet('meta','sect',{t:1});for(let k=0;k<DEF.length;k++)await sSet('sectors',DEF[k][0],{n:DEF[k][1],ic:DEF[k][2],t:Date.now()+k})}}catch(e){}seeding=0}
a.sort((x,y)=>x.t-y.t);SECT=a.map(x=>[x._id,x.n,x.ic]);cb(SECT)})}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=null,me=null,admin=false,view='home',sec='police',unsub=null;
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const KEY='$2a$10$EVJpa1kkUQx4JG6CPhwT8eMpLADFaWQc7iR5SShpZRDJSGC2sThvi';
const BIN={users:'6b002ef6ac6210605a9736c6',profiles:'6b002f2dffd5d16053d0eca4',ranks:'6b002f5aac6210605a97379d',sectors:'6b002f8bac6210605a9737fe',news:'6b002fb5ac6210605a973860',apps:'6b002fdfffd5d16053d0ee16',msgs:'6b003003ffd5d16053d0ee6f',meta:'6b003033ffd5d16053d0eee4'};
const where=c=>c.startsWith('msgs_')?'msgs':(c=='names'||c=='meta'||c=='staff')?'meta':c=='cases'?'apps':c;
const pre=c=>({names:'n:',meta:'m:',staff:'s:',cases:'c:'})[c]||'';
const H={'Content-Type':'application/json','X-Master-Key':KEY},cache={},qu={},subs=[];
async function load(b,force){const c=cache[b];if(!force&&c&&Date.now()-c.t<15000)return c.d;
const r=await fetch('https://api.jsonbin.io/v3/b/'+BIN[b]+'/latest',{headers:{...H,'X-Bin-Meta':'false'}});if(!r.ok)throw new Error('JSONBin '+r.status);
const j=await r.json(),d=(j.record||j).items||{};cache[b]={d,t:Date.now()};return d}
function ping(b){subs.forEach(x=>x.b==b&&x.run(false))}
function mutate(b,fn){qu[b]=(qu[b]||Promise.resolve()).catch(()=>{}).then(async()=>{const d=await load(b,true);fn(d);
const r=await fetch('https://api.jsonbin.io/v3/b/'+BIN[b],{method:'PUT',headers:H,body:JSON.stringify({items:d})});if(!r.ok)throw new Error('JSONBin '+r.status);cache[b]={d,t:Date.now()};ping(b)});return qu[b]}
async function sGet(c,k,f){const d=await load(where(c),f);return d[pre(c)+k]||null}
async function sSet(c,k,v){return mutate(where(c),d=>{d[pre(c)+k]=c.startsWith('msgs_')?{...v,_s:c}:v})}
async function sDel(c,k){return mutate(where(c),d=>{delete d[pre(c)+k]})}
function sListen(c,cb){const b=where(c),p=pre(c),m=c.startsWith('msgs_');let on=true;
const run=async f=>{try{const d=await load(b,f);if(!on)return;cb(Object.entries(d).filter(([k,v])=>m?v._s==c:p?k.startsWith(p):!k.startsWith('c:')).map(([k,v])=>({...v,_id:p?k.slice(p.length):k})))}catch(e){console.error(e)}};
const x={b,run};subs.push(x);run(false);const iv=setInterval(()=>{if(!document.hidden)run(true)},m?6000:30000);
return()=>{on=false;clearInterval(iv);const i=subs.indexOf(x);if(i>-1)subs.splice(i,1)}}

if(!/^\S+@\S+\.\S+$/.test(e))return er.textContent='اكتب إيميل صحيح';if(p.length<6)return er.textContent='الباسورد 6 أحرف على الأقل';
try{const k=await sha(e),u=await sGet('users',k,1);
if(reg){if(!n)return er.textContent='اكتب اسمك';const nk=await sha(n.toLowerCase());if(ADMINS.includes(n.toLowerCase())){const c=await sGet('names',nk,1);if(c&&c.uid!=k)return er.textContent='هذا الاسم محجوز للإدارة';if(!c)await sSet('names',nk,{uid:k})}if(u)return er.textContent='هذا الإيميل مسجل من قبل';
const salt=crypto.randomUUID(),id='MT-'+(Math.floor(Math.random()*9e6)+1e6);await sSet('users',k,{name:n,id,salt,ph:await sha(salt+p),t:Date.now()});await sSet('profiles',id,{name:n,id,rk:'',t:Date.now()});me={key:k,name:n,id}}
else{if(!u||u.ph!==await sha(u.salt+p))return er.textContent='الإيميل أو الباسورد غلط';me={key:k,name:u.name,id:u.id}}
try{localStorage.setItem('mt_s',JSON.stringify(me))}catch(x){}await calcAdmin();render()}catch(x){er.textContent='صار خطأ، حاول مرة ثانية'}}}

function render(){const a=$('#app');if(unsub){unsub();unsub=null}
$('#hd').hidden=!me;if(!me){a.innerHTML=authHTML();return bindAuth()}
$('#hl').src=LOGO;$('#pm').hidden=true;$('#pi').hidden=true;$('#pu').hidden=!can('full');$('#pa').hidden=!can('addSec');$('#ps').hidden=true;$('#pu').onclick=()=>{view='users';render()};$('#pa').onclick=()=>{$('#ps').hidden=!$('#ps').hidden;$('#psm').textContent=''};$('#psb').onclick=async()=>{const n=$('#psn').value.trim();if(!n)return;await sSet('sectors',crypto.randomUUID(),{n,ic:$('#psi').value.trim()||'🏷️',t:Date.now()});$('#psn').value=$('#psi').value='';$('#psm').textContent='تمت الإضافة ✅'};
$('#pb').onclick=e=>{e.stopPropagation();$('#pm').hidden=!$('#pm').hidden};$('#pm').onclick=e=>e.stopPropagation();
$('#pd').onclick=()=>{const i=$('#pi');i.hidden=false;i.innerHTML=me.guest?'ضيف (بدون ID)':`الاسم: <b>${esc(me.name)}</b><br>الـ ID: <b dir="ltr">${esc(me.id)}</b>${admin?'<br>👑 Owner':RANK?'<br>🎖️ '+esc(RANK):''}`};
$('#nav').innerHTML=[['home','📰 الأخبار'],['secs','🏛️ القطاعات'],['apply','📝 التقديمات'],['staff','🛡️ الإدارة'],['cases','⚖️ القضايا'],...(admin||RSEC.length||can('delMsg')?[['chat','💬 الشات']]:[])].map(([v,t])=>`<button class="${v==view?'on':''}" data-v="${v}">${t}</button>`).join('');
document.querySelectorAll('#nav button').forEach(b=>b.onclick=async()=>{view=b.dataset.v;await calcAdmin();render()});
({home,apply,chat,users,secs:secView,staff:staffView,cases:casesView})[view]()}
document.addEventListener('click',()=>{$('#pm').hidden=true});
$('#out').onclick=()=>{me=null;admin=false;try{localStorage.removeItem('mt_s')}catch(e){}render()};

function home(){$('#app').innerHTML=`<section class="hero"><img src="${LOGO}" alt=""><h1>مرحباً ${esc(me.name)}</h1><p class="mut">كل أخبار الماب وتحديثاته هنا</p></section><h2>📰 أخبار الماب</h2>
${can('editNews')?`<div class="card"><input id="nt" placeholder="عنوان الخبر"><textarea id="nb" placeholder="نص الخبر"></textarea><button class="btn" id="np">نشر الخبر</button></div>`:''}<div id="nl"></div>`;
if(can('editNews'))$('#np').onclick=async()=>{const t=$('#nt').value.trim(),b=$('#nb').value.trim();if(!t)return;await sSet('news',crypto.randomUUID(),{title:t,body:b,t:Date.now()});$('#nt').value=$('#nb').value=''};
unsub=sListen('news',a=>{a.sort((x,y)=>y.t-x.t);$('#nl').innerHTML=a.length?a.map(n=>`<article class="card"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><small>${new Date(n.t).toLocaleDateString('ar')}</small> ${can('editNews')?`<button class="lnk" data-e="${n._id}">تعديل</button> `:''}${can('delNews')?`<button class="lnk" data-d="${n._id}">حذف</button>`:''}</article>`).join(''):'<p class="mut">لا توجد أخبار بعد.</p>';
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>sDel('news',b.dataset.d));
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const n=a.find(z=>z._id==b.dataset.e),c=b.closest('article');c.innerHTML=`<input class="ei" value="${esc(n.title)}"><textarea class="eb">${esc(n.body)}</textarea><div class="row"><button class="btn es">حفظ</button><button class="btn g ec">إلغاء</button></div>`;
c.querySelector('.es').onclick=()=>{const{_id,...d}=n;sSet('news',_id,{...d,title:c.querySelector('.ei').value.trim()||n.title,body:c.querySelector('.eb').value.trim()})};c.querySelector('.ec').onclick=()=>home()})})}

function secView(){$('#app').innerHTML=`<h2>🏛️ القطاعات</h2>${can('addSec')?`<div class="card"><b>إضافة قطاع</b><div class="row"><input id="sn" placeholder="اسم القطاع"><input id="si" placeholder="إيموجي" style="max-width:90px"></div><button class="btn" id="sa">إضافة</button></div>`:''}<div id="sl"></div>`;
if(can('addSec'))$('#sa').onclick=async()=>{const n=$('#sn').value.trim();if(!n)return;await sSet('sectors',crypto.randomUUID(),{n,ic:$('#si').value.trim()||'🏷️',t:Date.now()});$('#sn').value=$('#si').value=''};
unsub=sectors(l=>{$('#sl').innerHTML=l.length?l.map(s=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><b>${esc(s[2])} ${esc(s[1])}</b>${can('delSec')?`<button class="lnk" data-x="${s[0]}">حذف</button>`:''}</div>`).join(''):'<p class="mut">ما في قطاعات بعد.</p>';
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>sDel('sectors',b.dataset.x))})}

function apply(){$('#app').innerHTML=`<h2>📝 التقديمات</h2><div id="fm"></div><h3>${can('full')?'كل التقديمات':'تقديماتي'}</h3><div id="al"></div>`;
$('#fm').innerHTML=me.guest?'<div class="card"><p>لازم تسجل حساب عشان تقدّم.</p></div>':`<div class="card"><select id="as"></select><input id="ar" placeholder="اسمك في روبلوكس"><input id="ag" type="number" placeholder="العمر"><textarea id="aw" placeholder="ليش تبغى تنضم؟ وش خبرتك؟"></textarea><div class="err" id="ae"></div><button class="btn" id="ab">إرسال التقديم</button></div>`;
if(!me.guest)$('#ab').onclick=async()=>{const r=$('#ar').value.trim(),g=$('#ag').value,w=$('#aw').value.trim();if(!$('#as').value)return $('#ae').textContent='ما في قطاعات متاحة حالياً، انتظر الأونر يضيف قطاع';if(!r||!g||!w)return $('#ae').textContent='عبّ كل الحقول';
await sSet('apps',crypto.randomUUID(),{uid:me.id,name:me.name,sec:$('#as').value,rb:r,age:g,why:w,st:'p',t:Date.now()});$('#ae').textContent='';$('#ar').value=$('#ag').value=$('#aw').value=''};
const L={p:['قيد المراجعة',''],ok:['مقبول','ok'],no:['مرفوض','no']};let apps=[];
const draw=()=>{const a=apps.filter(x=>can('full')||x.uid==me.id).sort((x,y)=>y.t-x.t);$('#al').innerHTML=a.length?a.map(x=>{const s=SECT.find(z=>z[0]==x.sec)||['',x.sec,''];const l=L[x.st]||L.p;return`<div class="card"><b>${esc(s[2])} ${esc(s[1])}</b> <span class="st ${l[1]}">${l[0]}</span>${can('full')?`<p class="mut">${esc(x.name)} (${esc(x.uid)}) · روبلوكس: ${esc(x.rb)} · ${esc(x.age)} سنة</p><p>${esc(x.why)}</p><div class="row"><button class="btn" data-s="ok" data-i="${x._id}">قبول</button><button class="btn g" data-s="no" data-i="${x._id}">رفض</button></div>`:''}</div>`}).join(''):'<p class="mut">ما في تقديمات.</p>';
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const x=apps.find(z=>z._id==b.dataset.i),{_id,...d}=x;sSet('apps',_id,{...d,st:b.dataset.s})})};
unsub=join(sectors(l=>{const as=$('#as');if(as){const v=as.value;as.innerHTML=l.map(s=>`<option value="${s[0]}">${esc(s[2])} ${esc(s[1])}</option>`).join('');if(v)as.value=v}draw()}),sListen('apps',a=>{apps=a;draw()}))}

const PL=[['editNews','تعديل الأخبار'],['delNews','حذف الأخبار'],['addSec','فتح قطاع'],['delSec','حذف قطاع'],['delMsg','حذف رسائل الشات لكل القطاعات'],['addCase','إضافة قضايا للاعبين'],['full','إدارة كاملة لكل شي']];
const grp=r=>SECT.find(s=>s[0]==r.sec)?r.sec:'';
function users(){if(!can('full')){view='home';return render()}
$('#app').innerHTML=`<h2>👥 الحسابات والرتب</h2>${admin?'<div id="rs"></div><h3>الحسابات</h3>':''}<input id="us" placeholder="ابحث بالاسم أو الـ ID"><div id="ul"></div>`;
let list=[],rks=[],uk=[],sk='<';
const build=()=>{if(!admin)return;const k=SECT.map(x=>x[0]).join(',');if(k==sk)return;sk=k;
$('#rs').innerHTML=[['','🎖️ رتب عامة'],...SECT.map(x=>[x[0],x[2]+' '+x[1]])].map(g=>`<div class="card"><b>${esc(g[1])}</b>${g[0]?'<br><small class="mut">أي رتبة هنا تشوف شات هذا القطاع (مع الأونر)</small>':''}<div id="rl-${g[0]||'gen'}"></div><input class="rn" data-s="${g[0]}" placeholder="اسم رتبة جديدة"><details><summary class="mut">الصلاحيات (اختياري)</summary>${PL.map(p=>`<label style="display:block;margin:4px 0"><input type="checkbox" class="rc" data-s="${g[0]}" value="${p[0]}" style="width:auto;margin:0 0 0 6px">${p[1]}</label>`).join('')}</details><button class="btn rb" data-s="${g[0]}">إنشاء الرتبة</button></div>`).join('');
document.querySelectorAll('.rb').forEach(b=>b.onclick=async()=>{const sid=b.dataset.s,i=document.querySelector('.rn[data-s="'+sid+'"]'),n=i.value.trim();if(!n)return;const p=[...document.querySelectorAll('.rc[data-s="'+sid+'"]:checked')].map(x=>x.value);await sSet('ranks',crypto.randomUUID(),{name:n,perms:p,sec:sid,t:Date.now()});i.value='';document.querySelectorAll('.rc[data-s="'+sid+'"]').forEach(x=>x.checked=false)})};
const draw=()=>{build();const q=$('#us').value.trim().toLowerCase();
if(admin)[['',''],...SECT].forEach(g=>{const el=document.getElementById('rl-'+(g[0]||'gen'));if(el)el.innerHTML=rks.filter(r=>grp(r)==g[0]).map(r=>`<div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);margin-top:8px;padding-top:8px"><div><b>${esc(r.name)}</b><br><small>${(r.perms||[]).map(k=>(PL.find(p=>p[0]==k)||[0,k])[1]).join('، ')||'بدون صلاحيات'}</small></div><button class="lnk" data-rd="${r._id}">حذف</button></div>`).join('')});
const mine=p=>p.rks||(p.rk?[p.rk]:[]);
const grps=()=>[['','رتب عامة'],...SECT.map(x=>[x[0],x[2]+' '+x[1]])];
const a=list.filter(p=>!q||String(p.name).toLowerCase().includes(q)||String(p.id).toLowerCase().includes(q)).sort((x,y)=>x.t-y.t);
if($('#ul details[open]'))return;
$('#ul').innerHTML=a.length?a.map(p=>{const root=ADMINS.includes(String(p.name).toLowerCase()),my=mine(p),bd=rks.filter(r=>my.includes(r._id));return`<div class="card"><b>${esc(p.name)}</b> ${root?'<span class="st ok">Owner</span> ':''}${bd.map(r=>`<span class="st">${esc(r.name)}</span> `).join('')}<br><small dir="ltr">${esc(p.id)}</small>${admin&&!root?`<details><summary class="mut">الرتب (تقدر تختار أكثر من وحدة)</summary>${grps().map(g=>{const rs=rks.filter(r=>grp(r)==g[0]);return rs.length?`<small class="mut">${esc(g[1])}</small>${rs.map(r=>`<label style="display:block;margin:3px 0"><input type="checkbox" data-u="${p.id}" value="${r._id}" ${my.includes(r._id)?'checked':''} style="width:auto;margin:0 0 0 6px">${esc(r.name)}</label>`).join('')}`:''}).join('')||'<small class="mut">ما في رتب</small>'}</details>`:''}${admin&&!root&&p.id!=me.id?`<button class="lnk" data-x="${p.id}" style="color:#ff6b6b">🗑️ حذف الحساب</button>`:''}</div>`}).join(''):'<p class="mut">ما لقيت حسابات.</p>';
document.querySelectorAll('[data-u]').forEach(e=>e.onchange=()=>{const p=list.find(z=>z.id==e.dataset.u);if(!p)return;const st=new Set(mine(p));e.checked?st.add(e.value):st.delete(e.value);p.rks=[...st];p.rk='';sSet('profiles',p.id,{name:p.name,id:p.id,t:p.t,rks:p.rks})});
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(b.dataset.c!='1'){b.dataset.c='1';b.textContent='⚠️ اضغط مرة ثانية للتأكيد';return}const id=b.dataset.x,u=uk.find(z=>z.id==id);if(!u){b.textContent='تعذر الحذف، أعد المحاولة';return}await sDel('users',u._id);await sDel('profiles',id)});
document.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>sDel('ranks',b.dataset.rd))};
$('#us').oninput=draw;unsub=join(join(join(sListen('profiles',a=>{list=a;draw()}),sListen('ranks',a=>{rks=a.sort((x,y)=>x.t-y.t);draw()})),sectors(()=>draw())),sListen('users',a=>{uk=a}))}

function staffView(){$('#app').innerHTML=`<h2>🛡️ الإدارة</h2>${admin?`<div class="card"><b>إضافة للقائمة</b><input id="fn" placeholder="الاسم"><input id="ft" placeholder="الرتبة (مثل: Owner، مشرف عام)"><button class="btn" id="fb">إضافة</button></div>`:''}<div id="fl"></div>`;
if(admin)$('#fb').onclick=async()=>{const n=$('#fn').value.trim();if(!n)return;await sSet('staff',crypto.randomUUID(),{name:n,title:$('#ft').value.trim(),t:Date.now()});$('#fn').value=$('#ft').value=''};
unsub=sListen('staff',a=>{a.sort((x,y)=>x.t-y.t);$('#fl').innerHTML=a.length?a.map(m=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>${esc(m.name)}</b><br><span class="st ok">${esc(m.title||'')}</span></div>${admin?`<div><button class="lnk" data-e="${m._id}">تعديل</button> <button class="lnk" data-d="${m._id}">حذف</button></div>`:''}</div>`).join(''):'<p class="mut">القائمة فاضية.</p>';
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>sDel('staff',b.dataset.d));
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const m=a.find(z=>z._id==b.dataset.e),c=b.closest('.card');c.style.display='block';c.innerHTML=`<input class="en" value="${esc(m.name)}"><input class="et" value="${esc(m.title||'')}"><div class="row"><button class="btn es">حفظ</button><button class="btn g ec">إلغاء</button></div>`;
c.querySelector('.es').onclick=()=>{const{_id,...d}=m;sSet('staff',_id,{...d,name:c.querySelector('.en').value.trim()||m.name,title:c.querySelector('.et').value.trim()})};c.querySelector('.ec').onclick=()=>staffView()})})}

function casesView(){if(me.guest){$('#app').innerHTML='<div class="card"><p>سجّل حساب عشان تشوف سجل القضايا.</p></div>';return}
$('#app').innerHTML=`<h2>⚖️ سجل القضايا</h2>${can('addCase')?`<div class="card"><b>إضافة قضية</b><input id="cpl" placeholder="اسم اللاعب في روبلوكس"><input id="cch" placeholder="القضية / التهمة"><textarea id="cdt" placeholder="التفاصيل (اختياري)"></textarea><div class="err" id="cer"></div><button class="btn" id="cad">إضافة للسجل</button></div>`:''}<input id="cq" placeholder="ابحث باسم اللاعب"><div id="cls"></div>`;
if(can('addCase'))$('#cad').onclick=async()=>{const p=$('#cpl').value.trim(),c=$('#cch').value.trim();if(!p||!c)return $('#cer').textContent='اكتب اسم اللاعب والقضية';$('#cer').textContent='';await sSet('cases',crypto.randomUUID(),{pl:p,ch:c,dt:$('#cdt').value.trim(),by:me.name,byId:me.id,t:Date.now()});$('#cpl').value=$('#cch').value=$('#cdt').value=''};
let list=[];const draw=()=>{const q=$('#cq').value.trim().toLowerCase();const a=list.filter(x=>!q||String(x.pl).toLowerCase().includes(q)).sort((x,y)=>y.t-x.t);
$('#cls').innerHTML=a.length?a.map(x=>`<div class="card"><b>${esc(x.pl)}</b> <span class="st no">${esc(x.ch)}</span>${x.dt?`<p>${esc(x.dt)}</p>`:''}<small class="mut">بواسطة ${esc(x.by)} · ${new Date(x.t).toLocaleDateString('ar')}</small> ${can('full')?`<button class="lnk" data-d="${x._id}">حذف</button>`:''}</div>`).join(''):'<p class="mut">ما في قضايا مسجلة.</p>';
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>sDel('cases',b.dataset.d))};
$('#cq').oninput=draw;unsub=sListen('cases',a=>{list=a;draw()})}

function chat(){const vis=id=>can('delMsg')||RSEC.includes(id);
$('#app').innerHTML=`<h2>💬 شات القطاعات</h2><div class="tabs" id="tb"></div><div class="card" style="padding:6px"><div id="msgs"></div></div><div id="cp"></div>`;
let ul=null,cur=null;
const send=async()=>{const i=$('#mi'),x=i.value.trim();if(!x||!sec||!vis(sec))return;i.value='';await sSet('msgs_'+sec,crypto.randomUUID(),{n:me.name,id:me.id,x:x.slice(0,500),t:Date.now()})};
const open=()=>{if(ul)ul();const c=sec;ul=sListen('msgs_'+c,a=>{a.sort((x,y)=>x.t-y.t);const m=$('#msgs');if(!m)return;m.innerHTML=a.slice(-80).map(x=>`<div class="m ${x.id==me.id?'me':''}"><b>${esc(x.n)} · ${esc(x.id)}</b><div>${esc(x.x)}</div>${can('delMsg')?`<button class="lnk" data-m="${x._id}">حذف</button>`:''}</div>`).join('')||'<p class="mut">ما في رسائل، كن أول واحد!</p>';m.scrollTop=m.scrollHeight;
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>sDel('msgs_'+c,b.dataset.m))})};
unsub=join(sectors(l=>{const v=l.filter(x=>!me.guest&&vis(x[0]));
if(!v.length){$('#tb').innerHTML='';$('#msgs').innerHTML='<p class="mut">الشات متاح للأونر وأفراد القطاعات (أصحاب رتبة القطاع) فقط.</p>';$('#cp').innerHTML='';if(ul){ul();ul=null}cur=null;return}
if(!v.find(x=>x[0]==sec))sec=v[0][0];
$('#tb').innerHTML=v.map(x=>`<button class="tab ${x[0]==sec?'on':''}" data-c="${x[0]}">${esc(x[2])} ${esc(x[1])}</button>`).join('');
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{sec=b.dataset.c;render()});
if(cur!=sec){cur=sec;open();$('#cp').innerHTML=`<div class="row" style="flex-wrap:nowrap"><input id="mi" placeholder="اكتب رسالتك…" style="flex:4"><button class="btn" id="ms" style="flex:1;margin:5px 0">إرسال</button></div>`;$('#ms').onclick=send;$('#mi').onkeydown=e=>{if(e.key=='Enter')send()}}}),()=>ul&&ul())}

(async()=>{if(KEY.startsWith('PASTE')){$('#app').innerHTML='<div class="card"><p>حط الـ Access Key في أول السكربت (const KEY).</p></div>';return}
try{me=JSON.parse(localStorage.getItem('mt_s'));if(me&&!me.guest&&!await sGet('users',me.key)){me=null;localStorage.removeItem('mt_s')}}catch(e){}await calcAdmin();render()})();
</script></body></html>
